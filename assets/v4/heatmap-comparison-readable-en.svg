<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Readable comparison of eye-tracking attention patterns</title>
  <desc id="desc">A schematic vector reconstruction comparing attention patterns on baseline and shared-mental-model supported interfaces. All labels are horizontal.</desc>
  <defs>
    <radialGradient id="hot"><stop offset="0" stop-color="#ef665f" stop-opacity=".74"/><stop offset=".52" stop-color="#f3a36c" stop-opacity=".5"/><stop offset="1" stop-color="#f3d864" stop-opacity="0"/></radialGradient>
    <radialGradient id="warm"><stop offset="0" stop-color="#f0c94f" stop-opacity=".72"/><stop offset=".58" stop-color="#f5e28a" stop-opacity=".42"/><stop offset="1" stop-color="#f5e28a" stop-opacity="0"/></radialGradient>
    <radialGradient id="focus"><stop offset="0" stop-color="#6bbf83" stop-opacity=".68"/><stop offset=".58" stop-color="#a7d9ae" stop-opacity=".38"/><stop offset="1" stop-color="#a7d9ae" stop-opacity="0"/></radialGradient>
    <style>
      .k{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#4f78d5;letter-spacing:1.5px}.t{font:700 40px 'Segoe UI',Arial,sans-serif;fill:#11312a}.s{font:500 21px 'Segoe UI',Arial,sans-serif;fill:#66736e}.h{font:700 22px 'Segoe UI',Arial,sans-serif;fill:#24413a}.l{font:600 18px 'Segoe UI',Arial,sans-serif;fill:#43544f}.panel{stroke-width:2.5}.ui{fill:#fff;stroke:#c2cac6;stroke-width:2}.line{fill:#e1e7e4}.btn{fill:#f5f7f6;stroke:#c5ccc8;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fbfaf5"/>
  <text class="k" x="85" y="70">STUDY 1 / EYE TRACKING</text>
  <text class="t" x="85" y="122">Where Visual Attention Was Allocated</text>
  <text class="s" x="85" y="160">Readable schematic based on the baseline and SMM-supported study conditions.</text>

  <rect class="panel" x="85" y="220" width="680" height="520" rx="28" fill="#e9f0ff" stroke="#5a86e1"/>
  <text class="h" x="125" y="270">BASELINE INTERFACE</text>
  <rect class="ui" x="125" y="305" width="600" height="375" rx="18"/>
  <rect class="line" x="165" y="345" width="520" height="36" rx="5"/>
  <rect class="line" x="165" y="415" width="245" height="160" rx="8"/>
  <rect class="line" x="440" y="415" width="245" height="160" rx="8"/>
  <rect class="btn" x="165" y="608" width="150" height="38" rx="9"/>
  <rect class="btn" x="330" y="608" width="150" height="38" rx="9"/>
  <rect class="btn" x="495" y="608" width="150" height="38" rx="9"/>
  <ellipse cx="315" cy="510" rx="195" ry="160" fill="url(#hot)"/>
  <ellipse cx="515" cy="565" rx="210" ry="160" fill="url(#warm)"/>

  <rect class="panel" x="835" y="220" width="680" height="520" rx="28" fill="#edf6e9" stroke="#568f70"/>
  <text class="h" x="875" y="270">SMM-SUPPORTED INTERFACE</text>
  <rect class="ui" x="875" y="305" width="600" height="375" rx="18"/>
  <rect x="915" y="335" width="520" height="58" rx="8" fill="#e1efdf"/>
  <rect class="line" x="915" y="425" width="245" height="150" rx="8"/>
  <rect class="line" x="1190" y="425" width="245" height="150" rx="8"/>
  <rect class="btn" x="915" y="608" width="150" height="38" rx="9"/>
  <rect class="btn" x="1080" y="608" width="150" height="38" rx="9"/>
  <rect class="btn" x="1245" y="608" width="150" height="38" rx="9"/>
  <ellipse cx="1040" cy="370" rx="150" ry="92" fill="url(#focus)"/>
  <ellipse cx="1260" cy="505" rx="175" ry="135" fill="url(#hot)"/>
  <ellipse cx="1290" cy="625" rx="150" ry="100" fill="url(#warm)"/>

  <rect x="85" y="780" width="680" height="72" rx="16" fill="#f2f4f3"/>
  <text class="l" x="125" y="824">More diffuse attention across comparison content</text>
  <rect x="835" y="780" width="680" height="72" rx="16" fill="#f2f4f3"/>
  <text class="l" x="875" y="824">Attention includes visible criteria and decision controls</text>
</svg>
