<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Readable master's thesis research framework</title>
  <desc id="desc">An English research framework with upright labels. Theoretical inputs inform the RLHF task environment, user and system mental models form a shared mental model, and the shared model guides feedback-interface design.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 10 5 0 10Z" fill="#89938f"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 10 5 0 10Z" fill="#568f70"/></marker>
    <style>
      .title{font:700 36px 'Segoe UI',Arial,sans-serif;fill:#11312a}
      .kicker{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#4f78d5;letter-spacing:1.5px}
      .node{font:600 24px 'Segoe UI',Arial,sans-serif;fill:#17332d;text-anchor:middle}
      .small{font:500 19px 'Segoe UI',Arial,sans-serif;fill:#30433e;text-anchor:middle}
      .tag{font:600 17px 'Segoe UI',Arial,sans-serif;fill:#465852;text-anchor:middle}
      .box{fill:#fbfcfa;stroke:#5c9275;stroke-width:2.5}
      .blue{fill:#edf3ff;stroke:#5a86e1;stroke-width:2.5}
      .purple{fill:#f5f0fb;stroke:#9a7abb;stroke-width:2.5}
      .yellow{fill:#fff9df;stroke:#d2bd45;stroke-width:2.5}
      .pink{fill:#fff0f3;stroke:#d68199;stroke-width:2.5}
      .tagbox{fill:#f4f2eb;stroke:#c9c5ba;stroke-width:1.5}
      .line{fill:none;stroke:#89938f;stroke-width:3;marker-end:url(#arrow)}
      .green{fill:none;stroke:#568f70;stroke-width:3.5;marker-end:url(#arrow-green)}
    </style>
  </defs>
  <rect width="1600" height="1100" fill="#fbfaf5"/>
  <text class="kicker" x="80" y="66">MASTER'S THESIS / CONCEPTUAL FRAMEWORK</text>
  <text class="title" x="80" y="116">From Theory to a Shared-Mental-Model Feedback Interface</text>

  <rect class="box" x="80" y="170" width="390" height="78" rx="18"/>
  <text class="node" x="275" y="218">RLHF Task Characteristics</text>
  <rect class="blue" x="605" y="170" width="390" height="78" rx="18"/>
  <text class="node" x="800" y="218">Shared Mental Model Theory</text>
  <rect class="purple" x="1130" y="170" width="390" height="78" rx="18"/>
  <text class="small" x="1325" y="205"><tspan x="1325">Cognitive Load and Transparency</tspan><tspan x="1325" dy="25">Interaction Theory</tspan></text>

  <path class="line" d="M275 248 V280 H675"/>
  <path class="line" d="M800 248 V280"/>
  <path class="line" d="M1325 248 V280 H925"/>
  <rect class="box" x="650" y="280" width="300" height="70" rx="17"/>
  <text class="node" x="800" y="324">Theory Translation</text>
  <path class="line" d="M800 350 V405"/>
  <rect class="box" x="600" y="405" width="400" height="72" rx="18"/>
  <text class="node" x="800" y="450">RLHF Task Environment</text>

  <rect class="tagbox" x="80" y="500" width="350" height="56" rx="15"/>
  <text class="tag" x="255" y="535">Task Understanding and Feedback</text>
  <rect class="tagbox" x="1170" y="500" width="350" height="56" rx="15"/>
  <text class="tag" x="1345" y="535">System Behavior and Feedback</text>
  <path class="line" d="M640 477 L465 590"/>
  <path class="line" d="M960 477 L1135 590"/>

  <rect class="blue" x="80" y="590" width="400" height="118" rx="20"/>
  <text class="node" x="280" y="658">User-Side Mental Model</text>
  <rect class="blue" x="540" y="575" width="520" height="148" rx="22"/>
  <text class="node" x="800" y="658">Shared Mental Model (SMM)</text>
  <rect class="blue" x="1120" y="590" width="400" height="118" rx="20"/>
  <text class="node" x="1320" y="658">System-Side Mental Model</text>
  <path class="line" d="M480 649 H540"/>
  <path class="line" d="M1120 649 H1060"/>

  <rect class="box" x="585" y="755" width="430" height="110" rx="22"/>
  <text class="small" x="800" y="795"><tspan x="800">SMM Construction and Alignment</tspan><tspan x="800" dy="28">Efficient Feedback Channel</tspan><tspan x="800" dy="28">Dynamic Interaction</tspan></text>
  <path class="green" d="M800 723 V755"/>
  <path class="green" d="M800 865 V905"/>

  <rect class="box" x="470" y="905" width="660" height="72" rx="18"/>
  <text class="node" x="800" y="950">Human-AI Feedback Interface</text>
  <rect class="box" x="80" y="905" width="250" height="72" rx="17"/>
  <text class="node" x="205" y="950">User</text>
  <rect class="yellow" x="1270" y="905" width="250" height="72" rx="17"/>
  <text class="node" x="1395" y="950">AI System</text>
  <path class="line" d="M330 941 H470"/>
  <path class="line" d="M1270 941 H1130"/>

  <rect class="tagbox" x="315" y="840" width="250" height="46" rx="13"/>
  <text class="tag" x="440" y="869">User Goals and Feedback</text>
  <rect class="tagbox" x="1035" y="840" width="285" height="46" rx="13"/>
  <text class="tag" x="1178" y="869">AI State and Output</text>

  <path class="line" d="M205 905 V800 H280 V708"/>
  <rect class="tagbox" x="80" y="755" width="300" height="48" rx="14"/>
  <text class="tag" x="230" y="785">Cognitive and Task Analysis</text>
  <path class="line" d="M1395 905 V800 H1320 V708"/>
  <rect class="tagbox" x="1220" y="755" width="300" height="48" rx="14"/>
  <text class="tag" x="1370" y="785">System State and Interpretation</text>

  <rect class="pink" x="650" y="1020" width="300" height="62" rx="16"/>
  <text class="node" x="800" y="1060">Researcher / Engineer</text>
  <path class="line" d="M800 1020 V977"/>
  <rect class="tagbox" x="940" y="995" width="310" height="46" rx="13"/>
  <text class="tag" x="1095" y="1024">Design, Deployment, and Evaluation</text>
</svg>
